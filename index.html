<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Modals for Giving Advice</title>
<style>
/* Layout: one full-screen sheet of grid paper; ink is drawn stroke by stroke in SVG and rubbed out on a canvas that repaints the paper. */
:root { --ink: #1B1B1B; --lead: #6E6E6E; --paper: #FCFCFB; --ui: "Comic Sans MS", "Trebuchet MS", sans-serif; color-scheme: light; }
html, body { height: 100%; }
body { margin: 0; overflow: hidden; background: var(--paper); color: var(--ink); font-family: var(--ui); }
#desk { position: fixed; inset: 0; perspective: 2200px; perspective-origin: 50% 0; background: #E9E9E7; }
@property --shade { syntax: "<number>"; inherits: true; initial-value: 0; }
.sheet { will-change: transform; position: absolute; inset: 0; background-color: var(--paper); transform-origin: 50% 0; backface-visibility: hidden; }
.sheet canvas { position: absolute; inset: 0; width: 100%; height: 100%;  }
.sheet::after { content: ""; position: absolute; inset: 0; background: linear-gradient(#000, transparent 80%); opacity: var(--shade, 0); pointer-events: none; }
#over, #ink { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }
#ink { z-index: 3; }
#pen { --cr: #1B1B1B; opacity: 0; transition: opacity .22s linear; }
#over { z-index: 4; }
#smear { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 2; pointer-events: none; filter: blur(7px); transition: opacity .6s linear; }
#eraser { position: fixed; left: 0; top: 0; z-index: 5; width: clamp(120px, 12vw, 200px); aspect-ratio: 170 / 92; margin: calc(clamp(120px, 12vw, 200px) * -.27) 0 0 calc(clamp(120px, 12vw, 200px) * -.5); opacity: 0; pointer-events: none; will-change: transform; transition: opacity .12s linear; }
path { fill: none; stroke-linecap: round; stroke-linejoin: round; }
.bar { position: fixed; z-index: 6; right: max(16px, env(safe-area-inset-right, 0px)); bottom: max(12px, env(safe-area-inset-bottom, 0px)); display: flex; gap: 8px; align-items: center; }
.bar button { font: inherit; color: var(--ink); background: none; border: 0; padding: 4px 8px; cursor: pointer; display: grid; place-items: center; transition: transform .18s ease, opacity .18s linear; }
.bar button canvas { display: block; }
.bar button:hover:enabled { transform: scale(1.1); }
.bar button:disabled { opacity: .28; cursor: default; }
.bar button:focus-visible { outline: 3px dashed var(--lead); outline-offset: 2px; border-radius: 8px; }
#startBtn { --k: min(100vw / 1600, 100vh / 900); position: fixed; z-index: 5; left: 50%; top: calc(50% + var(--k) * 205); width: calc(var(--k) * 380); height: calc(var(--k) * 150); transform: translate(-50%, -50%); background: none; border: 0; padding: 0; cursor: pointer; outline: none; }
.startart { transition: transform .2s ease, opacity .22s linear; transform-origin: 50% 72%; }
.startart.hot { transform: scale(1.06); }
.startart.gone { opacity: 0; }
.talk { transform-origin: 74% 90%; animation: talk .28s ease-in-out infinite alternate; }
@keyframes talk { from { transform: rotate(-.9deg) translateY(2px); } to { transform: rotate(.9deg) translateY(-5px); } }
.ring { transform-origin: 80% 45%; animation: ring .5s ease-in-out infinite alternate; }
@keyframes ring { from { transform: rotate(-1.6deg); } to { transform: rotate(1.6deg); } }
@media (prefers-reduced-motion: reduce) { .ring, .talk { animation: none; } }
.gbtn { position: fixed; z-index: 5; background: none; border: 0; padding: 0; cursor: pointer; border-radius: 10px; transition: background-color .15s linear; }
.gbtn:hover { background: rgba(255, 226, 122, .25); }
.gbtn:focus-visible { outline: 3px dashed #6E6E6E; outline-offset: 2px; }
.qrcode { position: fixed; z-index: 3; image-rendering: pixelated; }
</style>
</head>
<body>

<div id="desk"></div>
<svg id="ink" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid meet" aria-hidden="true">

    </linearGradient>

  <g id="pen">
    <g id="penTilt" transform="rotate(35) scale(1.32)">
      <path d="M-1.8 -1.5 Q0 -3.5 1.8 -1.5 L11 -32 Q0 -36 -11 -32 Z" style="fill:var(--cr);stroke:none"/>
      <path d="M-1.8 -1.5 Q0 -3.5 1.8 -1.5 L11 -32 Q0 -36 -11 -32 Z" style="fill:url(#crShade);stroke:none"/>
      <rect x="-11" y="-44" width="22" height="14" fill="var(--cr)"/>
      <rect x="-11" y="-44" width="22" height="14" fill="url(#crShade)"/>
      <path d="M-12.5 -38 l3.1 3 3.1 -3 3.1 3 3.1 -3 3.1 3 3.1 -3 3.1 3 3.1 -3 V-130 H-12.5 Z" style="fill:#F3F2EE;stroke:none"/>
      <rect x="-12.5" y="-58" width="25" height="8" fill="var(--cr)"/><rect x="-12.5" y="-47" width="25" height="2.6" fill="var(--cr)"/>
      <rect x="-12.5" y="-120" width="25" height="8" fill="var(--cr)"/><rect x="-12.5" y="-109" width="25" height="2.6" fill="var(--cr)"/>
      <ellipse cx="0" cy="-82" rx="8" ry="17" fill="var(--cr)"/><ellipse cx="0" cy="-82" rx="4.4" ry="11" fill="#F3F2EE"/>
      <path d="M-12.5 -38 l3.1 3 3.1 -3 3.1 3 3.1 -3 3.1 3 3.1 -3 3.1 3 3.1 -3 V-130 H-12.5 Z" style="fill:url(#crShade);stroke:none"/>
      <rect x="-11" y="-136" width="22" height="7" rx="3" fill="var(--cr)"/><rect x="-11" y="-136" width="22" height="7" rx="3" fill="url(#crShade)"/>
    </g>
  </g>
</svg>
<canvas id="over" aria-hidden="true"></canvas>
<svg id="eraser" viewBox="0 0 170 92" aria-hidden="true">
  <defs>
    <linearGradient id="erRub" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset=".6" stop-color="#F3F3F1"/><stop offset="1" stop-color="#D2D2CE"/></linearGradient>
    <linearGradient id="erBand" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#3C3C3B"/><stop offset=".55" stop-color="#1F1F1E"/><stop offset="1" stop-color="#0F0F0F"/></linearGradient>
    <radialGradient id="erShade"><stop offset="0" stop-color="#000" stop-opacity=".26"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
  </defs>
  <ellipse cx="88" cy="74" rx="82" ry="16" fill="url(#erShade)"/>
  <rect x="6" y="10" width="158" height="58" rx="17" fill="url(#erRub)" stroke="#A9A9A5" stroke-width="1.5"/>
  <path d="M60 10 H147 Q164 10 164 27 V51 Q164 68 147 68 H60 Z" style="fill:url(#erBand);stroke:none"/>
    <path d="M72 20 H150" style="stroke:#FFFFFF;stroke-width:3;opacity:.22"/>
  </svg>
<canvas id="smear" aria-hidden="true"></canvas>
<button id="startBtn" type="button" aria-label="Start"></button>
<nav class="bar" aria-label="Controls">
  <button id="soundBtn" type="button" aria-pressed="true"></button>
  <button id="prev" type="button"></button>
  <button id="next" type="button"></button>
</nav>

<script src="assets/letters.js"></script>
<script src="assets/qrcode.js"></script>
<script>

  /* ---------- sheets ---------- */
  let sheet;

    const el = document.createElement("div");

    { p: "It's freezing and I want to wear shorts!", a: "You'd better not wear shorts.", w: ["You'd not better wear shorts.", "You don't had better wear shorts."], why: "Not goes after better." },
    { p: "I told a lie to my mom!", a: "You ought to tell her the truth.", w: ["You ought tell her the truth.", "You ought telling her the truth."], why: "Ought always keeps its to." },
    { p: "My dad drives too fast!", a: "He ought not to drive so fast.", w: ["He oughts not to drive so fast.", "He not ought to drive so fast."], why: "Not goes between ought and to." },
    { p: "I found a wallet with money in it!", a: "You ought to return it.", w: ["You ought not to return it.", "You'd better not return it."], why: "Returning it is the right thing to do." },
    { p: "I eat junk food every day!", a: "You shouldn't eat so much junk food.", w: ["You should eat more junk food.", "You'd better eat junk food."], why: "Bad idea, so we use the negative." },
    { p: "The floor is wet and I'm running!", a: "You'd better be careful!", w: ["You'd better not be careful!", "You shouldn't be careful!"], why: "It's a warning: had better." },
    { p: "I'm really stressed!", a: "You should take a break.", w: ["You should takes a break.", "You should took a break."], why: "Always the base verb." },
    { p: "You need ideas. What do you ask?", ask: true, a: "What should I do?", w: ["What I should do?", "What do I should?"], why: "Wh- + should + subject + base verb." },
  ];
  const shuffled = (a) => { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  function pepeParts(g) {
    const P = (d, c = INK, w = 5) => shape(g, d, c, w);
    return [
      P(loopD(1190, 480, 142, 150)),
      P(smooth([[1076, 392], [1058, 322], [1112, 362], [1120, 282], [1168, 340], [1206, 262], [1232, 338], [1290, 286], [1282, 368], [1342, 344], [1304, 408]])),
      P(loopD(1136, 462, 38, 38)), P(loopD(1236, 454, 48, 48)),
      P(loopD(1146, 468, 7, 7), INK, 9), P(loopD(1226, 448, 9, 9), INK, 11),
      P(smooth([[1120, 556], [1190, 604], [1258, 544]])), P(smooth([[1120, 556], [1258, 544]])),
      P(smooth([[1110, 618], [1092, 700], [1090, 800]])), P(smooth([[1272, 616], [1298, 700], [1300, 800]])),
      P(smooth([[1282, 650], [1372, 620], [1370, 520]])),
      P(smooth([[1338, 400], [1376, 420], [1400, 500], [1398, 566]]), INK, 12),
      P(loopD(1338, 400, 24, 18), INK, 7), P(loopD(1398, 572, 24, 18), INK, 7),
    ];
  }
  const Overlay = (() => {
    const list = [];
    const place = (el, x, y, w, h) => { el.style.left = V.ox + x * V.k + "px"; el.style.top = V.oy + y * V.k + "px"; el.style.width = w * V.k + "px"; el.style.height = h * V.k + "px"; };
    const add = (el, x, y, w, h) => { list.push([el, x, y, w, h]); document.body.append(el); place(el, x, y, w, h); return el; };
    const clear = () => { list.splice(0).forEach(([el]) => el.remove()); };
    addEventListener("resize", () => list.forEach((l) => place(...l)));
    const button = (x, y, w, h, label, fn) => {
      const b = document.createElement("button");
      b.type = "button"; b.className = "gbtn"; b.setAttribute("aria-label", label);
      b.addEventListener("click", (e) => { e.stopPropagation(); fn(); });
      return add(b, x, y, w, h);
    };
    return { add, clear, button };
  })();
  const Game = (() => {
    let room = "", es = null, data = {}, phase = "off", phones = true, order = [], i = -1, scores = { A: 0, B: 0 };
    let q = null, opts = [], correct = 0, left = 0, timer = null, turn = "A", pepeG = null, countG = null, clockG = null, scoreG = null, online = false, localPick = null, startedAt = 0;
    const path = (p) => `${DB}/rooms/${room}${p}.json`;
    const send = (p, method, body) => fetch(path(p), { method, body: JSON.stringify(body), signal: AbortSignal.timeout(6000) });
    const quiet = (p, method, body) => send(p, method, body).catch(() => {});
    function merge(p, val, patch) {
      const keys = p.split("/").filter(Boolean);
      if (!keys.length) { if (patch) Object.assign(data, val); else data = val || {}; return; }
      let n = data;
      keys.slice(0, -1).forEach((k) => { n = n[k] = n[k] || {}; });
      const k = keys.at(-1);
      if (patch) n[k] = Object.assign(n[k] || {}, val);
      else if (val === null) delete n[k];
      else n[k] = val;
    }
    function listen() {
      es?.close();
      es = new EventSource(path(""));
      const on = (patch) => (e) => { const m = JSON.parse(e.data); merge(m.path, m.data, patch); changed(); };
      es.addEventListener("put", on(false));
      es.addEventListener("patch", on(true));
    }
    const teamOf = () => { const n = { A: 0, B: 0 }; for (const p of Object.values(data.players || {})) if (p.team) n[p.team]++; return n; };
    function changed() {
      const players = data.players || {};
      for (const [id, p] of Object.entries(players)) {
        if (p.team) continue;
        const n = teamOf(), team = n.A <= n.B ? "A" : "B";
        p.team = team;
        quiet(`/players/${id}`, "PATCH", { team });
      }
      if (data.state?.startedAt) startedAt = data.state.startedAt;
      if (phase === "lobby") showCounts();
      if (phase === "asking") {
        const got = Object.keys(data.answers?.["r" + i] || {}).length, all = Object.keys(players).length;
        showClock();
        if (phones && all && got >= all) timeUp();
      }
    }
    async function refill(g, fn) { g.items = []; g.ctx.clearRect(0, 0, g.canvas.width, g.canvas.height); await fn(); }
    const instant = (g, txt, x, y, size, o = {}) => write(txt, x, y, size, { g, instant: true, ...o });
    function showCounts() {
      const n = teamOf();
      refill(countG, async () => {
        await instant(countG, `Team A: ${n.A}`, 610, 512, 40);
        await instant(countG, `Team B: ${n.B}`, 610, 576, 40);
      });
    }
    function showScores() {
      refill(scoreG, () => instant(scoreG, `Team A: ${scores.A}     Team B: ${scores.B}`, 110, 852, 30));
    }
    function showClock() {
      refill(clockG, async () => {
        await instant(clockG, String(Math.ceil(left)), 1030, 140, 60, { center: true });
        if (phones) await instant(clockG, `${Object.keys(data.answers?.["r" + i] || {}).length} of ${Object.keys(data.players || {}).length} answered`, 620, 136, 28, { color: LEAD });
      });
    }
    const speak = (name, txt) => Sound.say(name, txt, () => pepeG?.canvas?.classList.add("talk"), () => pepeG?.canvas?.classList.remove("talk"));
    const num = () => POOL.indexOf(q);
    async function drawPepe() {
      pepeG = G({ own: true });
      await draw(pepeParts(pepeG), { dur: 1100 });
      await write("Pepe", 1195, 770, 34, { center: true, dur: 200 });
    }
    function reset() {
      clearInterval(timer); timer = null; es?.close(); es = null; Overlay.clear(); Sound.stopRing(); Sound.hush();
      data = {}; scores = { A: 0, B: 0 }; i = -1; online = false;
    }
    async function lobby() {
      reset();
      phase = "lobby"; phones = true;
      room = [...Array(4)].map(() => "ABCDEFGHJKMNPQRSTUVWXYZ"[Math.floor(Math.random() * 23)]).join("");
      order = shuffled(POOL).slice(0, CALLS);
      await heading("Advice Hotline: scan to play");
      await box(100, 200, 450, 450, { dur: 420, w: 6 });
      await write(`Room ${room}`, 325, 712, 38, { center: true });
      await write("Scan the QR.", 610, 300, 44);
      await write("Teams are automatic.", 610, 366, 28, { color: LEAD });
      countG = G({ own: true });
      await box(600, 630, 400, 100, { w: 6, dur: 320 });
      await write("Start game", 800, 696, 42, { center: true, dur: 340 });
      await write("Play without phones", 610, 800, 28, { color: LEAD, dur: 300 });
      await drawPepe();
      showCounts();
      Sound.preload(["intro", "winA", "winB", "tie", ...order.flatMap((c) => { const k = POOL.indexOf(c); return [`call${k}`, `right${k}`, `wrong${k}`]; })]);
      speak("intro", "Hi! I'm Pepe! Scan the code and help me, please!");
      const join = new URL("play.html", location.href);
      join.search = ""; join.searchParams.set("room", room);
      if (DB !== FIREBASE_URL) join.searchParams.set("db", DB);
      const qr = qrcode(0, "M"); qr.addData(join.href); qr.make();
      const n = qr.getModuleCount(), S = 12, c = document.createElement("canvas");
      c.width = c.height = (n + 4) * S;
      const x = c.getContext("2d");
      x.fillStyle = "#fff"; x.fillRect(0, 0, c.width, c.height); x.fillStyle = "#000";
      for (let r = 0; r < n; r++) for (let k = 0; k < n; k++) if (qr.isDark(r, k)) x.fillRect((k + 2) * S, (r + 2) * S, S, S);
      c.className = "qrcode"; c.setAttribute("role", "img"); c.setAttribute("aria-label", "QR code to join the game");
      Overlay.add(c, 120, 220, 410, 410);
      Overlay.button(600, 630, 400, 100, "Start game", () => forward());
      Overlay.button(600, 770, 420, 50, "Play without phones", () => { phones = false; forward(); });
      try {
        await send("", "PUT", { state: { phase: "lobby" } });
        online = true;
        listen();
      } catch (e) {
        phones = false;
        c.remove();
        await write("No connection", 325, 420, 34, { center: true, color: RED });
        await write("Play without phones.", 325, 470, 26, { center: true, color: LEAD });
      }
    }
    const publish = (state) => { if (phones && online) return quiet("/state", "PUT", state); };
    async function call() {
      i++; phase = "ringing"; q = order[i];
      Overlay.clear();
      await eraseAll();
      turn = i % 2 ? "B" : "A";
      await heading(`Call ${i + 1} of ${CALLS}`);
      scoreG = G({ own: true }); clockG = G({ own: true });
      showScores();
      await drawPepe();
      const bub = G();
      await box(1270, 170, 290, 100, { dur: 240, g: bub });
      await write("Ring ring!", 1415, 236, 36, { center: true, dur: 240, g: bub });
      pepeG.canvas.classList.add("ring");
      Sound.ring(2);
      await wait(1300);
      Sound.stopRing(); Sound.pick();
      pepeG.canvas.classList.remove("ring");
      bub.remove(); redraw(sheet);
      await box(1290, 170, 260, 100, { dur: 200 });
      await write("Hello?!", 1420, 236, 44, { center: true, dur: 240 });
      await line(1340, 276, 1324, 336, { w: 5 });
      opts = shuffled([q.a, ...q.w]); correct = opts.indexOf(q.a); localPick = null;
      await publish({ phase: "call", round: i, problem: q.p, opts, startedAt: { ".sv": "timestamp" } });
      speak(`call${num()}`, `Hello?! This is Pepe! ${q.p}`);
      left = SECONDS; phase = "asking"; startedAt = 0;
      const t0 = performance.now();
      showClock();
      timer = setInterval(() => {
        const was = Math.ceil(left);
        left = Math.max(0, SECONDS - (performance.now() - t0) / 1000);
        if (Math.ceil(left) !== was) showClock();
        if (left <= 0) timeUp();
      }, 200);
      await write(`Pepe: ${q.p}`, 110, 222, 34);
      if (!phones) await write(`Team ${turn}, your turn!`, 110, 282, 30, { color: LEAD });
      for (let k = 0; k < 3; k++) {
        const y = 330 + k * 150;
        await box(110, y, 830, 118, { color: LEAD, dur: 180 });
        await write(`${"ABC"[k]}.  ${opts[k]}`, 136, y + 74, 32, { dur: 300 });
        if (!phones) Overlay.button(110, y, 830, 118, `Answer ${"ABC"[k]}`, () => pick(k));
      }
    }
    function pick(k) { if (phase === "asking" && !phones) { localPick = k; timeUp(); } }
    const timeUp = () => { if (phase === "asking") { phase = "closing"; clearInterval(timer); timer = null; go(); } };
    function score() {
      if (!phones) {
        const ok = localPick === correct, pts = ok ? 100 + Math.round(100 * left / SECONDS) : 0;
        scores[turn] += pts;
        return ok ? 1 : 0;
      }
      const got = data.answers?.["r" + i] || {}, sum = { A: 0, B: 0 }, size = { A: 0, B: 0 };
      let right = 0, total = 0;
      for (const [id, p] of Object.entries(data.players || {})) {
        if (p.team) size[p.team]++;
        const a = got[id];
        if (!a) continue;
        total++;
        if (a.c !== correct) continue;
        right++;
        const late = startedAt && a.at ? (a.at - startedAt) / (SECONDS * 1000) : .5;
        sum[p.team] += 100 + Math.round(100 * Math.max(0, 1 - late));
      }
      for (const t of ["A", "B"]) scores[t] += size[t] ? Math.round(sum[t] / size[t]) : 0;
      return total ? right / total : 0;
    }
    async function reveal() {
      skip = false;
      phase = "reveal";
      Overlay.clear(); Sound.hush();
      const rate = score();
      refill(clockG, async () => {});
      const y = 330 + correct * 150;
      for (let k = 0; k < 3; k++) if (k !== correct) { const yy = 330 + k * 150; await line(136, yy + 60, 900, yy + 56, { w: 4, color: RED, dur: 160 }); }
      await box(110, y, 830, 118, { color: GREEN, dur: 240, w: 6 });
      await check(958, y + 62);
      showScores();
      await publish({ phase: "reveal", round: i, correct, why: q.why, scores });
      speak(`${rate >= .5 ? "right" : "wrong"}${num()}`, q.a);
      await write(q.why, 110, 792, 28, { color: LEAD });
    }
    async function finish() {
      phase = "end";
      Overlay.clear();
      await eraseAll();
      const win = scores.A === scores.B ? "" : scores.A > scores.B ? "A" : "B";
      const title = win ? `Team ${win} wins!` : "It's a tie!";
      const t = await write(title, 110, 330, 96);
      await marker(t.x, 350, t.x + t.w, 18);
      await write(`Team A: ${scores.A}`, 110, 480, 48);
      await write(`Team B: ${scores.B}`, 110, 560, 48);
      await publish({ phase: "end", win, scores });
      await drawPepe();
      pepeG.canvas.classList.add("talk");
      Sound.tada(); party();
      speak(win ? `win${win}` : "tie", "You are the best! Thank you!");
      phase = "done";
    }
    async function go() { if (busy) { skip = true; pendingNext = true; return; } run(next); }
    async function next() {
      if (phase === "lobby" || phase === "reveal") { if (phase === "lobby" || i + 1 < CALLS) return call(); return finish(); }
      if (phase === "asking") { phase = "closing"; clearInterval(timer); timer = null; }
      if (phase === "closing") return reveal();
    }
    function close() { reset(); phase = "off"; }
    return { lobby, next, close, active: () => phase !== "off" && phase !== "done", backOk: () => phase === "lobby" || phase === "done", key: (k) => pick(k) };
  })();

  /* ---------- navigation ---------- */
  let cur = 0, step = -1, started = false, pendingNext = false;
  let startArt = null;
  const boot = sheetReady.then(async () => {
    label($("prev"), "Back"); label($("next"), "Next"); label($("soundBtn"), "Sound: on");
    skip = true;
    await coverTitle();
    startArt = G({ own: true });
    startArt.canvas.classList.add("startart");
    await box(620, 590, 360, 130, { g: startArt, w: 6 });
    await write("Start", 800, 678, 62, { center: true, g: startArt });
    await write("Turn your sound on", 800, 784, 28, { center: true, color: LEAD, g: startArt });
    skip = false;
  });
  async function begin() {
    if (started) return;
    started = true; busy = true;
    Sound.init();
    await boot;
    $("startBtn").hidden = true;
    startArt.canvas.classList.add("gone");
    await new Promise((ok) => setTimeout(ok, 240));
    startArt.remove();
    await run(() => deck[0].steps[0]());
  }
  $("startBtn").addEventListener("click", begin);
  for (const [ev, on] of [["mouseenter", true], ["mouseleave", false], ["focus", true], ["blur", false]]) $("startBtn").addEventListener(ev, () => startArt?.canvas?.classList.toggle("hot", on));
  function toggleSound() { const v = Sound.toggle(); label($("soundBtn"), "Sound: " + (v ? "on" : "off")); $("soundBtn").setAttribute("aria-pressed", String(v)); }
  $("soundBtn").addEventListener("click", (e) => { toggleSound(); e.currentTarget.blur(); });
  async function run(fn) {
    busy = true; skip = false;
    await fn();
    busy = false; skip = false;
    parkPen();
    refresh();
    if (pendingNext) { pendingNext = false; forward(); }
  }
  function refresh() {
    $("prev").disabled = cur === 0 && step <= 0;
    $("next").disabled = cur === deck.length - 1 && step === deck[cur].steps.length - 1;
  }
  async function forward() {
    if (!started) return begin();
    if (busy) { skip = true; return; }
    const d = deck[cur];
    if (d.game && Game.active()) return run(() => Game.next());
    if (step < d.steps.length - 1) { step++; const i = step; await run(() => d.steps[i]()); return; }
    if (cur === deck.length - 1) return;
    const nextIdx = cur + 1;
    if (d.game) Game.close();
    await run(async () => {
      const t = deck[nextIdx].transition;
      if (t === "flip") await flip(); else await eraseAll();
      cur = nextIdx; step = 0;
      refresh();
      await deck[cur].steps[0]();
    });
  }
  async function backward() {
    if (!started) return;
    if (busy) { skip = true; return; }
    if (deck[cur].game && !Game.backOk()) return;
    if (deck[cur].game) Game.close();
    Sound.stopRing(); Sound.hush();
    let c = cur, s = step - 1;
    if (s < 0) { if (c === 0) return; c--; s = deck[c].steps.length - 1; }
    await run(async () => {
      skip = true;
      clearSheet();
      cur = c; step = s; seed = 7;
      for (let i = 0; i <= s; i++) await deck[c].steps[i]();
    });
  }
  $("next").addEventListener("click", (e) => { forward(); e.currentTarget.blur(); });
  $("prev").addEventListener("click", (e) => { backward(); e.currentTarget.blur(); });
  desk.addEventListener("click", forward);
  addEventListener("keydown", (e) => {
    if (e.target.closest && e.target.closest("button") && (e.key === " " || e.key === "Enter")) return;
    if (e.key === "ArrowRight" || e.key === " " || e.key === "PageDown" || e.key === "Enter") { e.preventDefault(); forward(); }
    else if (e.key === "ArrowLeft" || e.key === "PageUp") { e.preventDefault(); backward(); }
    else if (e.key === "m" || e.key === "M") toggleSound();
    else if ("123".includes(e.key) && deck[cur].game) Game.key(+e.key - 1);
  });
  addEventListener("resize", () => { makePaper(); });

  makePaper();
  sheet = newSheet();
  step = 0; refresh();
  $("startBtn").focus({ preventScroll: true });
})();
</script>
</body>
